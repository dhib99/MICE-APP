<div class="register-container">
  <h2>Créer un compte</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="cin">CIN</label>
      <input id="cin" formControlName="cin" type="number" placeholder="CIN" />
    </div>

    <div class="form-group">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" formControlName="username" type="text" placeholder="Nom d'utilisateur" />
    </div>

    <div class="form-group">
      <label for="firstname">Prénom</label>
      <input id="firstname" formControlName="firstname" type="text" placeholder="Prénom" />
    </div>

    <div class="form-group">
      <label for="lastname">Nom</label>
      <input id="lastname" formControlName="lastname" type="text" placeholder="Nom" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" placeholder="Email" />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" formControlName="password" type="password" placeholder="Mot de passe" />
    </div>

    <div class="form-group">
      <label for="adresse">Adresse</label>
      <input id="adresse" formControlName="adresse" type="text" placeholder="Adresse" />
    </div>

    <div class="form-group">
      <label for="role">Rôle</label>
      <select id="role" formControlName="role">
        <option value="COMMERCIAL">Commercial</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status">Statut</label>
      <input id="status" formControlName="status" type="checkbox" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid">S'inscrire</button>
  </form>
</div>
